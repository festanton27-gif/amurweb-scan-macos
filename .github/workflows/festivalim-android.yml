name: Festivalim Android Prototype

on:
  push:
    branches:
      - 'festivalim-match3-0.2.3'
    paths:
      - 'festivalim/**'
      - '.github/workflows/festivalim-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36' 'cmdline-tools;latest' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Restore Festivalim 0.2.3 visual assets
        shell: bash
        run: |
          set -euo pipefail
          cat festivalim/ci/icon023.part00 festivalim/ci/icon023.part01 festivalim/ci/icon023.part02 \
            | tr -d '\r\n' | base64 --decode > festivalim/assets/icon_023.png
          cat festivalim/ci/tiles02395.part00 festivalim/ci/tiles02395.part01 festivalim/ci/tiles02395.part02 \
              festivalim/ci/tiles02395.part03 festivalim/ci/tiles02395.part04 festivalim/ci/tiles02395.part05 \
            | tr -d '\r\n' | base64 --decode > festivalim/assets/tiles_023.webp
          test -s festivalim/assets/icon_023.png
          test -s festivalim/assets/tiles_023.webp
          file festivalim/assets/icon_023.png festivalim/assets/tiles_023.webp
          python3 - <<'PY'
          from pathlib import Path
          icon = Path('festivalim/assets/icon_023.png').read_bytes()
          tiles = Path('festivalim/assets/tiles_023.webp').read_bytes()
          assert icon.startswith(b'\x89PNG\r\n\x1a\n'), 'launcher icon is not PNG'
          assert tiles.startswith(b'RIFF') and tiles[8:12] == b'WEBP', 'tile atlas is not WEBP'
          assert len(tiles) > 30000, 'tile atlas unexpectedly small'
          print('Festivalim visual assets OK:', len(icon), len(tiles))
          PY

      - name: Restore development signing and Godot Android settings
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          base64 --decode festivalim/ci/dev-keystore.b64 > "$HOME/.android/festivalim-dev.keystore"
          keytool -list -keystore "$HOME/.android/festivalim-dev.keystore" -storepass festivalim-dev -alias festivalimdev >/dev/null
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/festivalim-dev.keystore"
          export/android/debug_keystore_user = "festivalimdev"
          export/android/debug_keystore_pass = "festivalim-dev"
          EOF

      - name: Export Android APK with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./festivalim/
          use_preset_export_path: true
          export_debug: true
          cache: true
          presets_to_export: Android
          verbose: true

      - name: Validate Godot project
        shell: bash
        run: |
          set +e
          GODOT=$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*' | head -n 1)
          "$GODOT" --headless --path festivalim --editor --quit 2>&1 | tee /tmp/festivalim-validation.log
          CODE=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Error importing|Failed loading resource|Could not preload resource' /tmp/festivalim-validation.log; then
            exit 1
          fi
          test "$CODE" -eq 0

      - name: Verify APK exists
        shell: bash
        run: |
          test -s festivalim/build/Android/Festivalim-0.2.3-DEV.apk

      - name: Upload Festivalim APK
        uses: actions/upload-artifact@v4
        with:
          name: Festivalim-0.2.3-DEV-apk
          path: festivalim/build/Android/Festivalim-0.2.3-DEV.apk
          if-no-files-found: error
          retention-days: 14
