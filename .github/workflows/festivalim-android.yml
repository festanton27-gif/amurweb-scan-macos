name: Festivalim Android Prototype

on:
  push:
    branches:
      - festivalim-prototype-0.1.1
    paths:
      - 'festivalim/**'
      - '.github/workflows/festivalim-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36' 'cmdline-tools;latest' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Create debug keystore and Godot Android settings
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Android APK with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./festivalim/
          use_preset_export_path: true
          export_debug: true
          cache: true
          presets_to_export: Android
          verbose: true

      - name: Show APK files
        if: always()
        shell: bash
        run: |
          find . -type f -name '*.apk' -print || true

      - name: Upload Festivalim APK
        uses: actions/upload-artifact@v4
        with:
          name: Festivalim-0.1.1-prototype-apk
          path: |
            festivalim/build/*.apk
            build/**/*.apk
          if-no-files-found: error
          retention-days: 14
